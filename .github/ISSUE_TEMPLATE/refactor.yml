name: refactor（整理・リファクタ）
description: 動作は変えずに、配線やコードを整理する
title: "refactor(スコープ): "
labels: ["refactor"]
body:
  - type: markdown
    attributes:
      value: |
        タイトル欄を `refactor(スコープ): 整理すること` にしてください。括弧内は下で選んだスコープに置き換えます。

        例: `refactor(sch): 抵抗のシンボルを統一`

        動作や電気的な仕様を変える作業は feat か fix にしてください。
  - type: dropdown
    id: scope
    attributes:
      label: スコープ
      description: タイトルの括弧内と揃えてください。
      options:
        - "hw: ハードウェア全般（分類に迷った基板・回路）"
        - "sch: 回路図。対象は hardware/"
        - "pcb: パターン設計。対象は hardware/"
        - "sw: ソフトウェア全般。対象は software/"
        - "sys: システム全体（ハードウェアとソフトウェアの両方）"
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: 対象
      description: 整理する基板、回路、プログラムの場所。
      placeholder: hardware/sensor/sensor.kicad_sch
  - type: textarea
    id: summary
    attributes:
      label: 整理する内容
      description: 見た目や構成のどこを揃えるかを書いてください。
      placeholder: 抵抗のシンボルを共通ライブラリのものに揃える。
    validations:
      required: true
  - type: textarea
    id: unchanged
    attributes:
      label: 変えないこと
      description: この作業で維持する動作や仕様を書いてください。
      value: |
        動作は変えない。
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 補足
