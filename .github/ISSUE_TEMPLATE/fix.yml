name: fix（修正・バグ対応）
description: 回路のミスや、プログラムのバグを直す
title: "fix(スコープ): "
labels: ["fix"]
body:
  - type: markdown
    attributes:
      value: |
        タイトル欄を `fix(スコープ): 直すこと` にしてください。括弧内は下で選んだスコープに置き換えます。

        例: `fix(pcb): 3.3Vラインの配線幅が細すぎる問題を修正`

        ブランチは `fix/番号-名前` にしてください。例: `fix/2-power_trace_width`
  - type: dropdown
    id: scope
    attributes:
      label: スコープ
      description: タイトルの括弧内と揃えてください。
      options:
        - "hw: ハードウェア全般（分類に迷った基板・回路）"
        - "sch: 回路図。対象は hardware/"
        - "pcb: パターン設計。対象は hardware/"
        - "sw: ソフトウェア全般。対象は software/"
        - "sys: システム全体（ハードウェアとソフトウェアの両方）"
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: 対象
      description: 直す基板、回路、プログラムの場所。
      placeholder: hardware/power/power.kicad_pcb
  - type: textarea
    id: problem
    attributes:
      label: 起きている問題
      description: 今どうなっているかを書いてください。
      placeholder: 3.3Vラインの配線幅が細く、電流容量が足りない。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する状態
      description: 直ったあとどうなっていればよいかを書いてください。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: プログラムの不具合なら、再現する操作を書いてください。回路のミスなら空でも構いません。
      placeholder: |
        1. センサを接続する
        2. 読み出しを実行する
  - type: textarea
    id: notes
    attributes:
      label: 補足
      description: ログ、測定値、スクリーンショットがあれば書いてください。
