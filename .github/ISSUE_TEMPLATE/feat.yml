name: feat（新機能・新規追加）
description: 新しい回路や、新しいプログラム機能を追加する
title: "feat(スコープ): "
labels: ["feat"]
body:
  - type: markdown
    attributes:
      value: |
        タイトル欄を `feat(スコープ): やること` にしてください。括弧内は下で選んだスコープに置き換えます。

        例: `feat(sch): モータードライバ回路の追加`
  - type: dropdown
    id: scope
    attributes:
      label: スコープ
      description: タイトルの括弧内と揃えてください。
      options:
        - "hw: ハードウェア全般（分類に迷った基板・回路）"
        - "sch: 回路図。対象は hardware/"
        - "pcb: パターン設計。対象は hardware/"
        - "sw: ソフトウェア全般。対象は software/"
        - "sys: システム全体（ハードウェアとソフトウェアの両方）"
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: 対象
      description: 追加する基板、回路、プログラムの場所。
      placeholder: hardware/motor_driver/
  - type: textarea
    id: summary
    attributes:
      label: 追加する内容
      description: 何を新しく足すかを書いてください。
      placeholder: モータードライバ回路を追加する。
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 完了条件
      description: このIssueを閉じられる状態を書いてください。
      placeholder: 回路図にドライバを追加し、電源と制御信号が接続されている。
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 補足
      description: 参照するデータシート、関連Issue、制約があれば書いてください。
