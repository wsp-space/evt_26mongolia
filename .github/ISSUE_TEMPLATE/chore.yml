name: chore（雑務・その他）
description: ライブラリ更新、CI、ビルド設定など、機能追加でも修正でもない作業
title: "chore(スコープ): "
labels: ["chore"]
body:
  - type: markdown
    attributes:
      value: |
        タイトル欄を `chore(スコープ): やること` にしてください。括弧内は下で選んだスコープに置き換えます。

        例: `chore(sw): KiCad共通ライブラリの参照を更新`

        回路や機能そのものを足す作業は feat、不具合を直す作業は fix にしてください。
  - type: dropdown
    id: scope
    attributes:
      label: スコープ
      description: タイトルの括弧内と揃えてください。
      options:
        - "hw: ハードウェア全般（分類に迷った基板・回路）"
        - "sch: 回路図。対象は hardware/"
        - "pcb: パターン設計。対象は hardware/"
        - "sw: ソフトウェア全般。対象は software/"
        - "sys: システム全体（ハードウェアとソフトウェアの両方）"
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: 対象
      description: 触る設定、ライブラリ、ファイルの場所。
      placeholder: .github/
  - type: textarea
    id: summary
    attributes:
      label: 作業内容
      description: 何をするかを書いてください。
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 完了条件
      description: このIssueを閉じられる状態を書いてください。
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 補足
